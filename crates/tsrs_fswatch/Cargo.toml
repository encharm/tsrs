[package]
name = "tsrs_fswatch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rustc-hash.workspace = true
tsrs_core.workspace = true
# kqueue / inotify / pipe / pathconf / stat bindings (Go: golang.org/x/sys/unix).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# ReadDirectoryChangesW and the file APIs of windows.go (Go: golang.org/x/sys/windows).
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Threading",
] }

[lib]
doctest = false
